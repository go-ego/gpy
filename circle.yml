
# circle.yml #
version: 2.1

orbs:
  codecov: codecov/codecov@6

jobs:
  build:
    docker:
      - image: golang:1.27
    steps:
      - checkout
      - run: go mod download
      - run: go vet ./...
      # codecov.io
      - run: go test -v -covermode=count -coverprofile=coverage.out ./...
      - codecov/upload

workflows:
  build:
    jobs:
      - build
